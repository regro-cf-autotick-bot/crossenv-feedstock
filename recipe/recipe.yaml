schema_version: 1

context:
  name: crossenv
  version: "1.6.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/crossenv-${{ version }}.tar.gz
  sha256: df83f28fd04a3ae17b85a4a7c8fdc44e4cf6b0d898bf47312864f3e429c7f640
  patches:
    - patches/0004-Only-set-sys.executable-while-cross-python-exists.patch
    - patches/0005-Accept-any-Apple-OS-name-in-the-triple-split.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - crossenv
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: A cross-compiling tool for Python extension modules
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/benfogle/crossenv

extra:
  recipe-maintainers:
    - chrisburr
    - isuruf
